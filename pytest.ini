[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
    -m "not slow"
markers =
    slow: end-to-end training / generation runs (minutes, not seconds)
    model: builds or loads a real Keras model
    integration: spans multiple subsystems
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
